<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金龙红利科技 - 周报汇总</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f5f7fa;
      --card-bg: #fff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --success: #dc2626;
      --danger: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    header p {
      opacity: 0.9;
      font-size: 16px;
    }
    .latest-report {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .latest-report h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--primary);
    }
    .latest-report iframe {
      width: 100%;
      height: 600px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .history-section {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .history-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--primary);
    }
    .report-list {
      display: grid;
      gap: 12px;
    }
    .report-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
    }
    .report-item:hover {
      background: #e8ecf1;
      transform: translateX(4px);
    }
    .report-date {
      font-weight: 600;
      font-size: 16px;
    }
    .report-return {
      font-size: 18px;
      font-weight: 700;
    }
    .report-return.positive { color: var(--success); }
    .report-return.negative { color: var(--danger); }
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    @media (max-width: 768px) {
      header h1 { font-size: 24px; }
      .latest-report iframe { height: 400px; }
      .report-item { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>金龙红利科技</h1>
    <p>投资组合周报汇总 | 成立日期：2025-06-03 | 共 1 期周报</p>
  </header>

  <div class="container">
    <section class="latest-report">
      <h2>📊 最新周报</h2>
      <iframe src="reports/2026-04-19.html" title="最新周报"></iframe>
    </section>

    <section class="history-section">
      <h2>📚 历史周报</h2>
      <div class="report-list">
        
        <a href="reports/2026-04-19.html" class="report-item">
          <span class="report-date">2026年04月19日 周报</span>
          <span class="report-return positive">+7.29%</span>
        </a>
      </div>
    </section>
  </div>

  <footer>
    <p>数据仅供参考，不构成投资建议</p>
    <p>最后更新：2026年04月24日 09:59</p>
  </footer>
</body>
</html>
