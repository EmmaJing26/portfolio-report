<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金龙红利科技 - 周报汇总</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --bg: #f0f4f8;
      --card-bg: #fff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --red: #dc2626;
      --green: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── 顶部 Header ── */
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      color: white;
      padding: 40px 20px 36px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    header .subtitle {
      font-size: 14px;
      opacity: 0.75;
      letter-spacing: 0.5px;
    }

    /* ── 主体容器 ── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    /* ── 卡片网格 ── */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ── 单期周报卡片 ── */
    .report-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(30,58,138,0.15);
    }

    /* 蓝色头部 */
    .card-banner {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      color: white;
      padding: 20px 20px 16px;
    }
    .card-banner .week-label {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .card-banner .portfolio-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .card-banner .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .card-banner .stat-item {
      text-align: center;
    }
    .card-banner .stat-val {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .card-banner .stat-val.pos { color: #fca5a5; }
    .card-banner .stat-val.neg { color: #86efac; }
    .card-banner .stat-lbl {
      font-size: 10px;
      opacity: 0.65;
      margin-top: 2px;
    }

    /* 白色底部 */
    .card-body {
      padding: 14px 20px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .card-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      border-radius: 8px;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
    }
    .card-link:hover { opacity: 0.88; }
    .card-link svg {
      width: 14px; height: 14px;
      fill: none; stroke: currentColor; stroke-width: 2.2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── footer ── */
    footer {
      text-align: center;
      padding: 0 0 32px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 2;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 22px; }
      .report-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>金龙红利科技</h1>
    <div class="subtitle">投资组合周报汇总 &nbsp;·&nbsp; 成立日期 2025-06-03 &nbsp;·&nbsp; 共 1 期</div>
  </header>

  <div class="container">
    <div class="report-grid">
      
      <div class="report-card">
        <div class="card-banner">
          <div class="week-label">2026.04.15 - 2026.04.23 &nbsp;·&nbsp; 2026年04月23日 周报</div>
          <div class="portfolio-name">金龙红利科技</div>
          <div class="stats-row">
            <div class="stat-item">
              <div class="stat-val pos">+5.56%</div>
              <div class="stat-lbl">本周收益</div>
            </div>
            <div class="stat-item">
              <div class="stat-val pos">+77.87%</div>
              <div class="stat-lbl">累计收益</div>
            </div>
            <div class="stat-item">
              <div class="stat-val pos">+53.23%</div>
              <div class="stat-lbl">超额收益</div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span>数据截至 2026-04-23</span>
            <span>运行 325 天</span>
          </div>
          <a class="card-link" href="reports/2026-04-23.html" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            查看完整周报
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>数据仅供参考，不构成投资建议</p>
    <p>最后更新：2026年04月24日 13:26</p>
  </footer>

</body>
</html>
